<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎴 UNO Game | Highly Graphical</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Fredoka One', cursive, sans-serif;
      background: radial-gradient(circle at 20% 20%, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow-x: hidden;
    }
    #game-container {
      width: 100%;
      max-width: 800px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
    }
    #message-area {
      background: rgba(255,255,255,0.15);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 1.1em;
      backdrop-filter: blur(10px);
      text-align: center;
    }
    button {
      background: #e94560;
      border: none;
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-family: inherit;
      font-size: 1em;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    button:hover { transform: scale(1.05); box-shadow: 0 6px 12px rgba(0,0,0,0.4); }
    .play-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .pile {
      width: 80px;
      height: 110px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5em;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      position: relative;
      transition: transform 0.3s;
    }
    .draw-pile {
      background: repeating-linear-gradient(45deg, #2c3e50, #2c3e50 10px, #34495e 10px, #34495e 20px);
      cursor: pointer;
      color: #ecf0f1;
      text-shadow: 2px 2px 4px black;
    }
    .discard-pile {
      background: white;
    }
    .hand {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 10px 0;
      padding: 10px;
      min-height: 130px;
    }
    .card {
      width: 70px;
      height: 100px;
      border-radius: 8px;
      background: #f5f5f5;
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.8em;
      color: #222;
      user-select: none;
    }
    .card:hover:not(.ai-card) {
      transform: translateY(-15px) scale(1.05);
      box-shadow: 0 12px 24px rgba(0,0,0,0.6);
      z-index: 10;
    }
    .card.ai-card {
      background: repeating-linear-gradient(45deg, #1e272e, #1e272e 8px, #2f3640 8px, #2f3640 16px);
      color: transparent;
      cursor: default;
      width: 50px;
      height: 70px;
      font-size: 1.2em;
      color: #dcdde1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card .corner {
      position: absolute;
      top: 5px;
      left: 8px;
      font-size: 0.5em;
      font-weight: bold;
    }
    .card .center-symbol {
      font-size: 1.4em;
      margin-top: 10px;
    }
    /* colors */
    .red { background: #e84118; color: white; }
    .blue { background: #00a8ff; color: white; }
    .green { background: #4cd137; color: white; }
    .yellow { background: #fbc531; color: #2d3436; }
    .wild { background: linear-gradient(135deg, #e84118, #fbc531, #4cd137, #00a8ff); color: white; text-shadow: 1px 1px 2px black; }
    /* modal */
    .uno-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #2f3640;
      padding: 25px;
      border-radius: 20px;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 0 30px black;
    }
    .uno-modal.active {
      display: flex;
    }
    .overlay {
      position: fixed;
      top:0;left:0;width:100%;height:100%;
      background: rgba(0,0,0,0.7);
      z-index: 50;
      display: none;
    }
    .overlay.active { display: block; }
    .color-picker {
      display: flex;
      gap: 12px;
    }
    .color-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 3px solid white;
      cursor: pointer;
    }
    @keyframes pop {
      0% { transform: scale(0); }
      80% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .pop { animation: pop 0.4s ease-out; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
</head>
<body>
<div id="game-container">
  <div class="top-bar">
    <div id="message-area">🟢 نوبت تو</div>
    <button id="restart-btn">🔄 شروع دوباره</button>
  </div>

  <!-- حریف‌ها -->
  <div id="ai1-hand" class="hand"></div>
  <div id="ai2-hand" class="hand"></div>

  <div class="play-area">
    <div class="pile draw-pile" id="draw-pile" title="Draw a card">🂠</div>
    <div class="pile discard-pile" id="discard-pile"></div>
  </div>

  <div id="human-hand" class="hand"></div>
  
  <!-- UNO Modal -->
  <div class="overlay" id="overlay"></div>
  <div class="uno-modal" id="uno-modal">
    <p style="font-size:1.5em;">😱 یک کارت داری!</p>
    <p>کلیک کن رو دکمه UNO</p>
    <button id="uno-btn">🔴 UNO!</button>
  </div>
  <!-- color picker modal for wild -->
  <div class="uno-modal" id="color-modal">
    <p>🎨 رنگ انتخاب کن</p>
    <div class="color-picker">
      <div class="color-btn" style="background:#e84118;" data-color="red"></div>
      <div class="color-btn" style="background:#00a8ff;" data-color="blue"></div>
      <div class="color-btn" style="background:#4cd137;" data-color="green"></div>
      <div class="color-btn" style="background:#fbc531;" data-color="yellow"></div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- UNO GAME ENGINE ----------
    const COLORS = ['red', 'blue', 'green', 'yellow'];
    const WILD_COLOR = 'wild';
    
    // Card class
    class Card {
      constructor(color, type, number=null) {
        this.color = color; // 'red','blue','green','yellow','wild'
        this.type = type;   // 'number','skip','reverse','draw2','wild','wild4'
        this.number = number;
      }
      toString() {
        if (this.type === 'number') return `${this.number}`;
        const map = { skip:'🚫', reverse:'↩️', draw2:'+2', wild:'🃏', wild4:'+4' };
        return map[this.type] || '?';
      }
      get display() { return this.toString(); }
    }

    function createDeck() {
      let deck = [];
      for (let color of COLORS) {
        deck.push(new Card(color, 'number', 0));
        for (let num = 1; num <= 9; num++) {
          deck.push(new Card(color, 'number', num));
          deck.push(new Card(color, 'number', num));
        }
        for (let i=0; i<2; i++) {
          deck.push(new Card(color, 'skip'));
          deck.push(new Card(color, 'reverse'));
          deck.push(new Card(color, 'draw2'));
        }
      }
      for (let i=0; i<4; i++) {
        deck.push(new Card(WILD_COLOR, 'wild'));
        deck.push(new Card(WILD_COLOR, 'wild4'));
      }
      return deck;
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    // Game State
    let players = [
      { name: '👦 تو', hand: [], isHuman: true },
      { name: '🤖 ربات آبی', hand: [], isHuman: false },
      { name: '🤖 ربات قرمز', hand: [], isHuman: false }
    ];
    let drawPile = [];
    let discardPile = [];
    let currentPlayer = 0;
    let direction = 1; // 1 or -1
    let chosenColor = null; // when wild played
    let gameOver = false;
    let winner = null;

    // UI references
    const humanHandEl = document.getElementById('human-hand');
    const ai1HandEl = document.getElementById('ai1-hand');
    const ai2HandEl = document.getElementById('ai2-hand');
    const discardEl = document.getElementById('discard-pile');
    const drawEl = document.getElementById('draw-pile');
    const messageEl = document.getElementById('message-area');
    const unoModal = document.getElementById('uno-modal');
    const overlay = document.getElementById('overlay');
    const colorModal = document.getElementById('color-modal');
    const restartBtn = document.getElementById('restart-btn');

    let pendingCardIndex = null; // for human UNO check

    // Helper: get current effective color
    function getTopEffectiveColor() {
      if (discardPile.length === 0) return null;
      let top = discardPile[discardPile.length-1];
      if (top.color === WILD_COLOR) return chosenColor; // after wild played
      return top.color;
    }

    // Can card be played on top?
    function canPlay(card) {
      if (gameOver) return false;
      if (discardPile.length === 0) return true;
      let top = discardPile[discardPile.length-1];
      let effectiveColor = getTopEffectiveColor();
      if (card.color === WILD_COLOR) return true; // wild/wild4 can always
      if (card.color === effectiveColor) return true;
      if (card.type === 'number' && top.type === 'number' && card.number === top.number) return true;
      if (card.type !== 'number' && card.type === top.type) return true; // same special
      return false;
    }

    // Draw n cards for player index
    function drawCards(playerIdx, n) {
      for (let i=0; i<n; i++) {
        if (drawPile.length === 0) {
          if (discardPile.length <= 1) break; // no cards left to reshuffle
          // reshuffle discard into draw, keeping top card
          let top = discardPile.pop();
          drawPile = discardPile.slice();
          discardPile = [top];
          shuffle(drawPile);
        }
        if (drawPile.length > 0) {
          players[playerIdx].hand.push(drawPile.pop());
        }
      }
    }

    // Play a card from player's hand
    function playCard(playerIdx, cardIndex, overrideColor=null) {
      let player = players[playerIdx];
      let card = player.hand.splice(cardIndex, 1)[0];
      discardPile.push(card);
      if (card.color === WILD_COLOR) {
        // need color choice
        if (overrideColor) {
          chosenColor = overrideColor;
        } else if (player.isHuman) {
          // handle via UI prompt; this function shouldn't be called until color chosen
          console.warn('Wild played without color choice');
          chosenColor = 'red'; // fallback
        } else {
          // AI picks most frequent color in hand
          chosenColor = pickBestColorForAI(player);
        }
      } else {
        chosenColor = null;
      }
      
      applyCardEffect(card);
    }

    function pickBestColorForAI(player) {
      let counts = { red:0, blue:0, green:0, yellow:0 };
      player.hand.forEach(c => {
        if (c.color !== WILD_COLOR) counts[c.color]++;
      });
      let max = -1, best = 'red';
      for (let col of COLORS) {
        if (counts[col] > max) { max = counts[col]; best = col; }
      }
      return best;
    }

    function applyCardEffect(card) {
      // Special effects happen immediately, affecting next player
      if (card.type === 'skip') {
        skipNextPlayer();
      } else if (card.type === 'reverse') {
        direction *= -1;
        // in 2-player game, reverse acts as skip. But we have 3, so just reverse direction.
      } else if (card.type === 'draw2') {
        drawAndSkipNext(2);
      } else if (card.type === 'wild4') {
        drawAndSkipNext(4);
      }
    }

    function skipNextPlayer() {
      let next = getNextPlayerIndex();
      // skip that player by moving currentPlayer past them
      currentPlayer = next; // will be incremented in endTurn to skip
      // but endTurn also adds direction, so we need to adjust: we want currentPlayer to become the one after next.
      // So we set currentPlayer to next, and endTurn will add direction and land on the second next.
      // That works.
    }

    function drawAndSkipNext(amount) {
      let next = getNextPlayerIndex();
      drawCards(next, amount);
      // skip their turn
      currentPlayer = next; // same as skip
    }

    function getNextPlayerIndex() {
      return (currentPlayer + direction + players.length) % players.length;
    }

    function endTurn() {
      // Move to next player
      currentPlayer = (currentPlayer + direction + players.length) % players.length;
      if (gameOver) return;
      updateUI();
      // check if current player is human or AI
      if (players[currentPlayer].isHuman) {
        messageEl.textContent = '🟢 نوبت توئه!';
      } else {
        messageEl.textContent = `⏳ ${players[currentPlayer].name} فکر می‌کنه...`;
        setTimeout(() => aiTurn(), 1000);
      }
      // Check if previous player (the one who just played) has 0 cards -> win
      let prev = (currentPlayer - direction + players.length) % players.length;
      if (players[prev].hand.length === 0) {
        gameOver = true;
        winner = prev;
        updateUI();
        messageEl.textContent = `🎉 ${players[winner].name} برنده شد! 🎉`;
      }
      // Check if human has to call UNO after drawing/playing
      if (!gameOver && players[currentPlayer].isHuman && players[currentPlayer].hand.length === 2) {
        // Human might need to call UNO on next own card play, so no action now.
      }
    }

    // Human plays card via UI click
    function humanPlayCard(cardIndex) {
      if (gameOver || !players[currentPlayer].isHuman) return;
      let card = players[currentPlayer].hand[cardIndex];
      if (!canPlay(card)) return;

      // Check UNO condition: if human about to play second-to-last card
      if (players[currentPlayer].hand.length === 2) {
        pendingCardIndex = cardIndex;
        showUNOModal();
        return;
      }
      // Otherwise, no UNO needed, play directly
      executeHumanPlay(cardIndex, null);
    }

    function executeHumanPlay(cardIndex, colorChoice) {
      let card = players[currentPlayer].hand[cardIndex];
      if (card.color === WILD_COLOR && !colorChoice) {
        // need color, show color picker
        pendingCardIndex = cardIndex;
        showColorModal();
        return;
      }
      playCard(currentPlayer, cardIndex, colorChoice);
      updateUI();
      endTurn();
    }

    function showUNOModal() {
      overlay.classList.add('active');
      unoModal.classList.add('active');
      // start 5 sec timer to auto-penalty if no response
      window.unoTimeout = setTimeout(() => {
        // penalty: draw 2 after playing
        if (pendingCardIndex !== null && players[currentPlayer].hand.length >= pendingCardIndex) {
          let card = players[currentPlayer].hand[pendingCardIndex];
          if (card.color === WILD_COLOR) {
            // need color first, skip penalty? For simplicity, force wild color default red, then draw penalty
            executeHumanPlay(pendingCardIndex, 'red');
          } else {
            executeHumanPlay(pendingCardIndex, null);
          }
          drawCards(currentPlayer, 2);
          updateUI();
          messageEl.textContent = '😓 یادت رفت UNO بگی! ۲ تا کارت جریمه شدی.';
        }
        hideUNOModal();
      }, 4000);
    }

    function hideUNOModal() {
      clearTimeout(window.unoTimeout);
      overlay.classList.remove('active');
      unoModal.classList.remove('active');
    }

    document.getElementById('uno-btn').addEventListener('click', () => {
      if (pendingCardIndex !== null) {
        clearTimeout(window.unoTimeout);
        let idx = pendingCardIndex;
        pendingCardIndex = null;
        hideUNOModal();
        // play card normally
        let card = players[currentPlayer].hand[idx];
        if (card.color === WILD_COLOR) {
          showColorModal(idx); // pass index
        } else {
          executeHumanPlay(idx, null);
        }
      }
    });

    function showColorModal(cardIdx) {
      pendingCardIndex = cardIdx || pendingCardIndex;
      overlay.classList.add('active');
      colorModal.classList.add('active');
    }
    function hideColorModal() {
      overlay.classList.remove('active');
      colorModal.classList.remove('active');
    }

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        let col = e.target.dataset.color;
        hideColorModal();
        if (pendingCardIndex !== null) {
          executeHumanPlay(pendingCardIndex, col);
        }
      });
    });

    // AI turn
    function aiTurn() {
      if (gameOver || players[currentPlayer].isHuman) return;
      let player = players[currentPlayer];
      // Find first playable card
      let playableIdx = player.hand.findIndex(c => canPlay(c));
      if (playableIdx !== -1) {
        let card = player.hand[playableIdx];
        // UNO check for AI: if AI will have 1 card after play, auto-call UNO (no penalty)
        if (player.hand.length === 2) {
          // AI always calls UNO implicitly, we just play
        }
        if (card.color === WILD_COLOR) {
          let col = pickBestColorForAI(player);
          playCard(currentPlayer, playableIdx, col);
        } else {
          playCard(currentPlayer, playableIdx);
        }
      } else {
        // draw a card
        drawCards(currentPlayer, 1);
        // check if drawn card can be played
        let newCardIdx = player.hand.length-1;
        if (canPlay(player.hand[newCardIdx])) {
          let card = player.hand[newCardIdx];
          if (card.color === WILD_COLOR) {
            playCard(currentPlayer, newCardIdx, pickBestColorForAI(player));
          } else {
            playCard(currentPlayer, newCardIdx);
          }
        }
      }
      updateUI();
      endTurn();
    }

    // Draw pile click for human to draw
    drawEl.addEventListener('click', () => {
      if (gameOver || !players[currentPlayer].isHuman) return;
      drawCards(currentPlayer, 1);
      updateUI();
      messageEl.textContent = '🃏 کارت کشیدی. می‌تونی بازی کنی یا نوبت رو رد کنی.';
      // allow player to optionally play the drawn card
      // To simplify, we'll let them click drawn card if playable; otherwise they'll pass by not clicking.
      // We'll enable a small "Pass" button? Or they just click another card? For now, they must click a card to play it; if they can't, they need a pass button.
      // Add a Pass button only after drawing? Let's implement a simple: after drawing, if no playable, they can click "Pass" that appears.
      // We'll add a pass button dynamically.
      if (players[currentPlayer].isHuman) {
        let passBtn = document.createElement('button');
        passBtn.textContent = '⏩ رد نوبت';
        passBtn.id = 'pass-btn';
        passBtn.style.marginTop = '10px';
        humanHandEl.parentNode.insertBefore(passBtn, humanHandEl.nextSibling);
        passBtn.addEventListener('click', function() {
          this.remove();
          endTurn();
        });
      }
    });

    function removePassButton() {
      let btn = document.getElementById('pass-btn');
      if (btn) btn.remove();
    }

    // Render UI
    function updateUI() {
      removePassButton();
      // discard pile top card
      if (discardPile.length > 0) {
        let top = discardPile[discardPile.length-1];
        discardEl.innerHTML = renderCardHTML(top, false);
        discardEl.classList.add('pop');
        setTimeout(() => discardEl.classList.remove('pop'), 400);
      } else {
        discardEl.innerHTML = '';
      }
      // human hand
      humanHandEl.innerHTML = '';
      players[0].hand.forEach((card, idx) => {
